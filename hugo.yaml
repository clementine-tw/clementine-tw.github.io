baseURL: https://clementine-tw.github.io/
locale: zh-tw
title: Clement's Blog
theme: ["PaperMod"]

params:
  profileMode:
    enabled: true
    title: Clement Tsai
    subtitle: |
      一位熱衷技術並持續學習的軟體工程師
    buttons:
      - name: Archive
        url: "/archive"
      - name: Github
        url: "https://github.com/clementine-tw/"
  ShowCodeCopyButtons: true
  ShowPostNavLinks: true

frontmatter:
  lastmod:
    - "lastmod"
    - ":git"
    - ":fileModTime"
    - "date"

caches:
  images:
    dir: :cacheDir/images
